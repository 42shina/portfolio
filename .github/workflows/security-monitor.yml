name: Daily security monitor

on:
  schedule:
    # 05:00 JST (20:00 UTC on the previous day).
    - cron: '0 20 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.node-version'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/security-monitor/**'
      - 'scripts/setup-npm.sh'
      - 'scripts/npm-security/**'
      - '.github/workflows/security-monitor.yml'

permissions:
  contents: read

concurrency:
  group: security-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Check security and publish counts only
        run: node scripts/security-monitor/monitor.mjs
